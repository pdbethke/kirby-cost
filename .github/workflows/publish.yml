name: Test, Publish & Cascade

# Proper rails for the cost engine: on push to main, run the unit suite,
# publish a version-bumped wheel+sdist to the private PyPI, then cascade a
# redeploy of kirby-api (which depends on kirby-cost). Mirrors
# kirby-combat/publish.yml, adapted for setup.py (version lives there, not
# pyproject) and the engine's test layout.
#
# NOTE on the test gate: the full Java-oracle suite (tests/test_oracle_fixtures
# + scripts/oracle_compare_v2) needs the bestiary HDC source files, which are
# NOT in the repo (they live on the author's box), so those tests skip in CI.
# Oracle parity is gated locally before merge (443/443). CI runs the unit
# suite, excluding the two suites that hardcode stale absolute fixture paths
# (test_hdc_roundtrip, test_metadata_roundtrip). If oracle fixtures are ever
# committed, drop the ignores and let CI run the full gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + test deps
        run: |
          pip install -e .
          pip install pytest
      - name: Run unit suite (oracle/roundtrip excluded — see header)
        run: |
          pytest -q --tb=short \
            --ignore=tests/test_hdc_roundtrip.py \
            --ignore=tests/test_metadata_roundtrip.py

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # contents:write lets the default GITHUB_TOKEN push the version-bump
      # commit back to main (no PAT needed for in-repo writes; the PAT is
      # only for the cross-repo cascade dispatch below).
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine

      - name: Bump version (max of setup.py + highest-on-PyPI, then +1 patch)
        id: bump
        env:
          PYPI_PASSWORD: ${{ secrets.PYPI_PRODUCTBINDER_PASSWORD }}
        run: |
          # version lives in setup.py: `    version="X.Y.Z",`
          CURRENT_LOCAL=$(grep -oP 'version="\K[^"]+' setup.py | head -1)
          PYPI_QUOTED=$(python -c "import os, urllib.parse; print(urllib.parse.quote(os.environ['PYPI_PASSWORD'], safe=''))")
          PYPI_VERSIONS=$(curl -s "https://productbinder:${PYPI_QUOTED}@pypi.productbinder.net/simple/kirby-cost/" \
            | grep -oE 'kirby_cost-[0-9]+\.[0-9]+\.[0-9]+' \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V -u || true)
          HIGHEST_PYPI=$(echo "$PYPI_VERSIONS" | tail -1)
          echo "setup.py: $CURRENT_LOCAL | PyPI latest: ${HIGHEST_PYPI:-none}"
          BASE=$(python -c "cur=tuple(int(x) for x in '$CURRENT_LOCAL'.split('.')); pypi=tuple(int(x) for x in '${HIGHEST_PYPI:-0.0.0}'.split('.')); print('$CURRENT_LOCAL' if cur >= pypi else '${HIGHEST_PYPI:-0.0.0}')")
          NEW=$(python -c "v='$BASE'.split('.'); v[-1]=str(int(v[-1])+1); print('.'.join(v))")
          echo "Bumping $BASE -> $NEW (setup.py was $CURRENT_LOCAL)"
          sed -i "s/version=\"$CURRENT_LOCAL\"/version=\"$NEW\"/" setup.py
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Build wheel + sdist
        run: python -m build --wheel --sdist

      - name: Publish to private PyPI
        env:
          TWINE_USERNAME: productbinder
          TWINE_PASSWORD: ${{ secrets.PYPI_PRODUCTBINDER_PASSWORD }}
        run: twine upload --repository-url https://pypi.productbinder.net/ dist/*

      - name: Commit version bump back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add setup.py
          git commit -m "chore: bump to ${{ steps.bump.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  cascade:
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Cross-repo dispatch needs a real PAT (default GITHUB_TOKEN is repo-scoped).
    # \`continue-on-error\` keeps a dispatch failure from failing the publish —
    # the wheel is already on PyPI and re-running would 400 on "already exists".
    # But the job itself MUST go red so a missing token is visible: kirby-combat
    # had this same step exit 0 on an unset secret and published green for
    # months while never redeploying kirby-api (found + fixed 2026-07-24).
    continue-on-error: true
    steps:
      - name: Trigger kirby-api redeploy (requires GH_DISPATCH_TOKEN)
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          NEW_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if [ -z "${GH_DISPATCH_TOKEN:-}" ]; then
            echo "::error::GH_DISPATCH_TOKEN not set — kirby-api was NOT redeployed."
            echo "::error::Manually run: gh workflow run -R pdbethke/kirby-api 'Test & Deploy'"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pdbethke/kirby-api/dispatches \
            -d "{\"event_type\":\"kirby-cost-updated\",\"client_payload\":{\"version\":\"$NEW_VERSION\"}}"
